[general]
# Smart pathing using placeholders
# `file` targets the DEV workbook (publish-out pipeline), never the locked .xlam.
file = "{config.path}/MORProcedures-dev.xlsm"
vba_directory = "{config.path}/vba-files"
verbose = true
rubberduck_folders = true
in_file_headers = true
keep_open = true
encoding = "utf-8"
python_env = "xlpy"